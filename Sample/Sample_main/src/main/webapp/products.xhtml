<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:th="http://www.thymeleaf.org">

<h:head>
    <title>Products - LegacyRetailManager</title>
</h:head>

<h:body>

    <h1>Product Catalog</h1>

    <h:form id="productForm">
        <h:panelGrid columns="2">
            <h:outputLabel for="productName" value="Name:"/>
            <h:inputText id="productName" value="#{productBean.name}" required="true"/>

            <h:outputLabel for="sku" value="SKU:"/>
            <h:inputText id="sku" value="#{productBean.sku}" required="true"/>

            <h:outputLabel for="price" value="Price:"/>
            <h:inputText id="price" value="#{productBean.price}"/>

            <h:outputLabel for="stock" value="Stock:"/>
            <h:inputText id="stock" value="#{productBean.stockQuantity}"/>
        </h:panelGrid>

        <h:commandButton value="Add Product" action="#{productBean.createProduct}">
            <f:ajax execute="@form" render="productTable"/>
        </h:commandButton>
    </h:form>

    <h:dataTable id="productTable" value="#{productBean.products}" var="product"
                 styleClass="product-table">
        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{product.id}"/>
        </h:column>
        <h:column>
            <f:facet name="header">Name</f:facet>
            <h:outputText value="#{product.name}"/>
        </h:column>
        <h:column>
            <f:facet name="header">SKU</f:facet>
            <h:outputText value="#{product.sku}"/>
        </h:column>
        <h:column>
            <f:facet name="header">Price</f:facet>
            <h:outputText value="#{product.price}">
                <f:convertNumber type="currency" currencySymbol="$"/>
            </h:outputText>
        </h:column>
        <h:column>
            <f:facet name="header">Stock</f:facet>
            <h:outputText value="#{product.stockQuantity}"/>
        </h:column>
    </h:dataTable>

    <!-- Thymeleaf mixed rendering -->
    <div th:each="product : ${products}">
        <span th:text="${product.name}">Product Name</span> -
        <span th:text="${product.sku}">SKU</span>
    </div>

</h:body>
</html>
