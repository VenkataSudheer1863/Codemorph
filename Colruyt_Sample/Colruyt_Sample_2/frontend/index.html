<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Finance Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
        }
        
        h1 span {
            color: var(--accent-color);
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .summary-card h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .summary-card .total {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success-color);
            margin-top: 0.5rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input {
            width: auto;
        }

        button.btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1rem;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        
        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }
        
        .badge-recurring {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            margin-left: 0.5rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Spend<span>Wise</span></h1>
        <div>Tracker Dashboard</div>
    </header>

    <div class="summary-card">
        <h2>Total Monthly Spend</h2>
        <div class="total" id="totalSpend">$0.00</div>
    </div>

    <div class="main-content">
        <!-- Add Expense Form -->
        <div class="card">
            <h3>Add Expense</h3>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" required placeholder="e.g. Netflix Subscription">
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Subscriptions">Subscriptions</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="isRecurring">
                    <label for="isRecurring" style="margin: 0;">Is this a recurring expense?</label>
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </div>

        <!-- Expense List -->
        <div class="card">
            <h3>Recent Expenses</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
                <div id="emptyMessage" class="empty-state" style="display: none;">
                    No expenses found. Start adding some!
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/expenses';

    const expenseForm = document.getElementById('expenseForm');
    const expenseList = document.getElementById('expenseList');
    const totalSpendEl = document.getElementById('totalSpend');
    const emptyMessage = document.getElementById('emptyMessage');
    
    document.getElementById('date').valueAsDate = new Date();
    document.addEventListener('DOMContentLoaded', fetchExpenses);

    expenseForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const expense = {
            description: document.getElementById('description').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value,
            isRecurring: document.getElementById('isRecurring').checked
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expense)
            });

            if (response.ok) {
                expenseForm.reset();
                document.getElementById('date').valueAsDate = new Date();
                fetchExpenses();
            } else {
                alert('Failed to add expense');
            }
        } catch (error) {
            console.error('Error adding expense:', error);
            alert('Could not connect to the server');
        }
    });

    async function fetchExpenses() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Network response was not ok');
            
            const expenses = await response.json();
            renderExpenses(expenses);
            calculateTotal(expenses);
        } catch (error) {
            console.error('Error fetching expenses:', error);
            expenseList.innerHTML = '';
            emptyMessage.style.display = 'block';
            emptyMessage.innerText = 'Could not load expenses. Ensure backend is running.';
            totalSpendEl.innerText = '$0.00';
        }
    }

    function renderExpenses(expenses) {
        expenseList.innerHTML = '';
        
        if (expenses.length === 0) {
            emptyMessage.style.display = 'block';
            emptyMessage.innerText = 'No expenses found. Start adding some!';
            return;
        }
        
        emptyMessage.style.display = 'none';

        expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

        expenses.forEach(exp => {
            const tr = document.createElement('tr');
            
            const expDate = new Date(exp.date);
            const formattedDate = expDate.toLocaleDateString();
            
            const recurringBadge = exp.isRecurring ? 
                '<span class="badge badge-recurring">↻ Recurring</span>' : '';

            tr.innerHTML = `
                <td>${formattedDate}</td>
                <td>
                    ${exp.description}
                    ${recurringBadge}
                </td>
                <td>${exp.category}</td>
                <td style="font-weight: 500;">$${exp.amount.toFixed(2)}</td>
                <td>
                    <button class="delete-btn" onclick="deleteExpense(${exp.id})" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    </button>
                </td>
            `;
            expenseList.appendChild(tr);
        });
    }

    function calculateTotal(expenses) {
        const currentMonth = new Date().getMonth();
        const currentYear = new Date().getFullYear();
        
        const monthlyTotal = expenses
            .filter(exp => {
                const expDate = new Date(exp.date);
                return expDate.getMonth() === currentMonth && expDate.getFullYear() === currentYear;
            })
            .reduce((sum, exp) => sum + exp.amount, 0);

        totalSpendEl.innerText = '$' + monthlyTotal.toFixed(2);
    }

    window.deleteExpense = async function(id) {
        if (!confirm('Are you sure you want to delete this expense?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                fetchExpenses();
            } else {
                alert('Failed to delete expense');
            }
        } catch (error) {
            console.error('Error deleting expense:', error);
            alert('Could not connect to the server');
        }
    }
</script>
</body>
</html>
